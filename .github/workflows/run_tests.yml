name: C/C++ CI

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  almalinux:
    runs-on: ubuntu-latest
    name: Test compile on latest AlmaLinux
    container:
      image: almalinux
    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        dnf install -y epel-release
        dnf install -y cmake make g++ catch-devel readline-devel yaml-cpp-devel spdlog-devel

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build project
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build/tests
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  ubuntu:
    runs-on: ubuntu-latest
    name: Test compile on Ubuntu
    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y cmake make g++ catch libreadline-dev libyaml-cpp-dev libspdlog-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build project
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build/tests
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
